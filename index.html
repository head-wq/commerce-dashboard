<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀별 현황판 · 2026년 8월</title>
<meta name="description" content="아카데미 · 대행 마케팅 · 대행 유튜브 · 커머스 팀별 현황판">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div id="app"></div>

<script src="./assets/data.js"></script>
<script src="./assets/ui.js"></script>
<script>
const TEAMS = [
  {
    href: "./academy.html", nm: "아카데미", ds: "초자립 판매 · 채널 마케팅 · 수강생 성과",
    real: "광고 지표 실측",
    mn: [
      { k: "매출", v: "9.8억", s: true },
      { k: "일 판매", v: "571건", s: true },
      { k: "CPL", v: "14,406원", s: false }
    ]
  },
  {
    href: "./agency-marketing.html", nm: "대행 마케팅파트", ds: "고객사 · 객단가 · 광고 운영 · 과제",
    real: null,
    mn: [
      { k: "매출", v: "1.42억", s: true },
      { k: "고객사", v: "23개사", s: true },
      { k: "객단가", v: "617만", s: true }
    ]
  },
  {
    href: "./agency-youtube.html", nm: "대행팀 유튜브파트", ds: "유지개월 · 채널 조회수 · 문의 전환",
    real: null,
    mn: [
      { k: "매출", v: "8,600만", s: true },
      { k: "고객사", v: "12개사", s: true },
      { k: "유지", v: "9.4개월", s: true }
    ]
  },
  {
    href: "./commerce.html", nm: "커머스", ds: "프로덕트별 매출 · 광고 효율 · 리뷰",
    real: "전체 실측",
    mn: [
      { k: "매출", v: "4.47억", s: false },
      { k: "알루바프로", v: "3.47억", s: false },
      { k: "더비랩", v: "7,672만", s: false }
    ]
  }
];

const tcard = t =>
  '<a class="tcard" href="' + t.href + '">' +
    '<div class="nm">' + esc(t.nm) + (t.real ? ' <span class="smp" style="color:var(--good);background:var(--good-bg)">' + esc(t.real) + '</span>' : ' <span class="smp">전체 샘플</span>') + '</div>' +
    '<div class="ds">' + esc(t.ds) + '</div>' +
    '<div class="mn">' + t.mn.map(m =>
      '<div>' + esc(m.k) + (m.s ? '<span class="smp">샘플</span>' : "") + '<b>' + esc(m.v) + '</b></div>'
    ).join("") + '</div>' +
  '</a>';

document.getElementById("app").innerHTML =
  nav("index") +
  '<div class="wrap">' +

  '<div class="hero">' +
    '<h1>팀별 현황판</h1>' +
    '<p>' + esc(DATA.meta.period) + ' 실적 · 팀을 선택하면 상세 지표를 볼 수 있습니다</p>' +
  '</div>' +

  '<div class="banner"><span class="ic">📌</span><span>' +
    '<b>커머스팀만 실제 수치입니다.</b> 8월 PDF에서 받은 데이터라 전부 실측값이고, ' +
    '아카데미는 광고 지표(소재 33개 · 위닝 7개 · CPL 14,406원 · 광고비 2.35억)만 실측입니다. ' +
    '나머지는 화면 확인용 <span class="smp">샘플</span> 숫자이니 실제 값을 주시면 교체하겠습니다.' +
  '</span></div>' +

  '<div class="grid g2">' + TEAMS.map(tcard).join("") + '</div>' +

  '<div class="sec" style="margin-top:26px">' +
    '<div class="sec-h"><h2>수치 채워넣는 방법</h2></div>' +
    '<div class="card">' +
      '<div style="font-size:13.5px;color:var(--ink-2);line-height:1.8">' +
        '모든 팀의 숫자는 <code style="background:var(--panel-3);padding:2px 6px;border-radius:4px">assets/data.js</code> 파일 <b style="color:var(--ink)">한 곳</b>에 모여 있습니다.<br>' +
        '팀별로 구역이 나뉘어 있고, 숫자만 바꾸면 표·그래프·비율이 모두 자동으로 다시 계산됩니다.<br>' +
        '값을 채운 항목은 <code style="background:var(--panel-3);padding:2px 6px;border-radius:4px">sample: true</code> 를 <code style="background:var(--panel-3);padding:2px 6px;border-radius:4px">false</code> 로 바꾸면 "샘플" 표시가 사라집니다.<br>' +
        '<b style="color:var(--ink)">수정 후 GitHub에 올리면 사이트가 자동으로 갱신됩니다.</b>' +
      '</div>' +
    '</div>' +
  '</div>' +

  pageFooter() +
  '</div>';
</script>
</body>
</html>
